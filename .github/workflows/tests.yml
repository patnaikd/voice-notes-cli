name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: '3.12'
      - run: uv sync --locked --all-extras
      - run: uv run --locked pytest -q
      - run: uv build --no-sources
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # The runner's preinstalled Node is used; vite needs Node 20.19+.
      - run: node --version
      - run: npm ci
      - run: npx vitest run
      - run: npm run build
      - name: Committed bundle matches web/src
        run: |
          git status --porcelain -- ../src/voice_notes/web/static
          test -z "$(git status --porcelain -- ../src/voice_notes/web/static)" || {
            echo "::error::src/voice_notes/web/static is stale; run npm --prefix web run build and commit it"; exit 1; }
