[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voice-notes-cli"
version = "0.1.0"
readme = "README.md"
description = "Local macOS meeting transcription with Claude Haiku meeting notes"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk==0.2.165",
    "python-dotenv>=1.2.4",
]

[project.optional-dependencies]
moonshine = ["moonshine-voice==0.1.5"]
dev = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/patnaikd/voice-notes-cli"
Documentation = "https://github.com/patnaikd/voice-notes-cli#readme"

[project.scripts]
voice-notes = "_voice_notes_launcher:main"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_notes"]

[tool.hatch.build.targets.wheel.force-include]
"packaging/_voice_notes_launcher.py" = "_voice_notes_launcher.py"

[tool.pytest.ini_options]
pythonpath = ["src"]

